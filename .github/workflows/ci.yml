name: CI

# Runs on every PR into dev (and pushes to dev/main for maintainers).
# A red pipeline blocks review. This is the CI gate the IC must pass.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client + database
        run: npm run setup

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The Playwright smoke test. The starter ships one intentionally
      # failing test (the transcript-1 gap: customer cannot see waitlist
      # position). It stays red until an IC closes the gap. That's by design.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm test
